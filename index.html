<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cosmic Hop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, comic caption boxes pinned to corners, thumb controls along the bottom edge. */
:root{
  --ink:#170f24; --paper:#fff7e0; --sun:#ffd23f; --pop:#ff4d6d; --sky:#39c6ff; --mint:#5df2c0; --space:#0a0720;
  --display:'Bangers','Comic Sans MS','Chalkboard SE','Marker Felt',Impact,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--space);color:var(--ink);font-family:var(--display);letter-spacing:.05em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .4s}
#ui.live{opacity:1}
.box{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:6px 12px;color:var(--ink)}
#panel{left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));transform:rotate(-1.5deg);min-width:150px}
#loc{font-size:24px;line-height:1}
#sub{font-size:14px;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums}
#spd{height:8px;border:2px solid var(--ink);border-radius:6px;margin-top:5px;background:#fff;overflow:hidden}
#spd i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--pop))}
#passport{right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));transform:rotate(2deg);background:var(--sun);font-size:20px;text-align:right}
#passport small{display:block;font-size:12px;opacity:.75}
#bSound{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 68px);pointer-events:auto;font-family:var(--display);letter-spacing:.05em;font-size:15px;
  color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:3px 10px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
#bSound:focus-visible{outline:3px solid #fff;outline-offset:3px}
#bSound[aria-pressed="false"]{opacity:.7}
.mk{position:absolute;left:0;top:0;font-size:13px;color:#fff;text-shadow:0 0 3px var(--ink),1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);white-space:nowrap;will-change:transform;text-align:center;line-height:1.05}
.mk b{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin:0 auto 2px;box-sizing:border-box}
.mk.off{opacity:.8}
.mk.off b{border-radius:3px;transform:rotate(45deg)}
#prompt{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1deg);font-size:20px;text-align:center;max-width:min(520px,56vw);opacity:0;transition:opacity .2s}
#prompt.on{opacity:1}
#prompt kbd{font-family:inherit;background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin:0 2px}
#toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(0);font-size:clamp(30px,7vw,64px);color:var(--sun);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);white-space:nowrap;text-align:center;pointer-events:none}
#toast.go{animation:pop 2.2s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}12%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);opacity:1}22%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-70%) scale(.9) rotate(-4deg);opacity:0}}
#lines{position:absolute;inset:-20%;opacity:0;transition:opacity .25s;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.0) 0deg 5deg,rgba(255,255,255,.55) 5.4deg 5.9deg,rgba(255,255,255,0) 6.3deg 11deg);
  -webkit-mask-image:radial-gradient(circle,transparent 38%,#000 75%);mask-image:radial-gradient(circle,transparent 38%,#000 75%);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(11deg)}}
/* thumb controls */
#stick{position:absolute;left:max(26px,env(safe-area-inset-left,0px));bottom:max(30px,env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;border:4px solid var(--ink);box-sizing:border-box;
  background:radial-gradient(circle at 3px 3px,rgba(23,15,36,.35) 1.6px,transparent 2px) 0 0/9px 9px,rgba(255,247,224,.55);display:none}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);box-sizing:border-box;box-shadow:3px 3px 0 var(--ink)}
.touch #stick{display:block}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:236px;height:230px}
.btn{position:absolute;pointer-events:auto;font-family:var(--display);letter-spacing:.05em;color:var(--ink);border:4px solid var(--ink);border-radius:50%;box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,opacity .15s}
.btn:active,.btn.held{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.dim{opacity:.45}
.btn[hidden]{display:none}
#bBoost{right:0;bottom:0;width:108px;height:108px;font-size:26px;background:var(--pop);color:#fff;text-shadow:2px 2px 0 var(--ink)}
#bLand{right:122px;bottom:6px;width:92px;height:92px;font-size:20px;background:var(--mint)}
#bExit{right:14px;bottom:122px;width:92px;height:92px;font-size:20px;background:var(--sun)}
.btn.pulse{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.09)}}
#help{left:max(12px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.5;transform:rotate(-1deg);opacity:.92}
#help kbd{font-family:inherit;background:var(--sun);border:2px solid var(--ink);border-radius:5px;padding:0 5px}
.touch #help{display:none}
/* title card */
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;
  background:radial-gradient(circle at 4px 4px,rgba(255,210,63,.16) 2px,transparent 2.6px) 0 0/14px 14px,rgba(10,7,32,.55);transition:opacity .5s}
#start.bye{opacity:0;pointer-events:none}
#start h1{margin:0;font-size:clamp(56px,15vw,150px);font-weight:400;line-height:.9;color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink),10px 10px 0 var(--pop);transform:rotate(-4deg)}
#start p{margin:0;font-size:clamp(16px,3.4vw,24px);color:#fff;text-shadow:2px 2px 0 var(--ink);max-width:34em}
#play{pointer-events:auto;font-family:var(--display);font-size:clamp(26px,6vw,44px);letter-spacing:.06em;padding:8px 40px;border:4px solid var(--ink);border-radius:14px;background:var(--mint);color:var(--ink);box-shadow:6px 6px 0 var(--ink);cursor:pointer;transform:rotate(2deg)}
#play:disabled{background:#cfc8c0;cursor:progress}
#play:focus-visible{outline:3px solid #fff;outline-offset:4px}
#err{color:#fff;background:var(--pop);border:3px solid var(--ink);border-radius:8px;padding:6px 12px;font-size:16px;max-width:90vw;white-space:pre-wrap}
@media (max-width:480px){#btns{transform:scale(.84);transform-origin:100% 100%}#stick{width:132px;height:132px}}
@media (max-width:640px){#loc{font-size:19px}#passport{font-size:16px}#prompt{font-size:16px;bottom:auto;top:calc(126px + env(safe-area-inset-top,0px));max-width:80vw}}
@media (prefers-reduced-motion:reduce){#lines{animation:none}.btn.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Cosmic Hop game view"></canvas>
<div id="ui">
  <div id="lines"></div>
  <div id="markers"></div>
  <div id="panel" class="box"><div id="loc">DEEP SPACE</div><div id="sub">&nbsp;</div><div id="spd"><i id="spdBar"></i></div></div>
  <div id="passport" class="box">★ <span id="pcount">0</span>/<span id="ptotal">0</span><small>WORLDS VISITED</small></div>
  <button id="bSound" type="button" aria-pressed="true">♪ SOUND ON</button>
  <div id="prompt" class="box"></div>
  <div id="toast"></div>
  <div id="help" class="box"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly / walk · <kbd>MOUSE</kbd> steer · <kbd>SHIFT</kbd> boost<br><kbd>L</kbd> land / take off · <kbd>E</kbd> exit / enter ship · <kbd>SPACE</kbd> climb / jump · <kbd>M</kbd> sound</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button id="bExit" class="btn" type="button" hidden>EXIT</button>
    <button id="bLand" class="btn" type="button">LAND</button>
    <button id="bBoost" class="btn" type="button">BOOST</button>
  </div>
</div>
<div id="start">
  <h1>COSMIC HOP</h1>
  <p id="tag">A pocket solar system to fly, land on and walk around.</p>
  <button id="play" type="button" disabled>BUILDING WORLDS…</button>
  <p id="how">Fly close to a world, land, hop out and explore — then blast off to the next one.</p>
  <div id="err" hidden></div>
</div>
<script type="module">
/* ==========================================================================
   COSMIC HOP — a comic-book solar system you can fly through and walk on.
   Single file. Three.js from jsDelivr. Sections:
     1  core + helpers        6  living planets (terrain, cities, traffic, air, sea)
     2  comic render pipeline 7  other planets + moons
     3  sky + sun             8  ship + astronaut
     4  bodies + orbits       9  input + mobile UI

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------- 1. CORE + HELPERS ---------- */
const V3=THREE.Vector3, Q=THREE.Quaternion, M4=THREE.Matrix4, C3=THREE.Color;
const TAU=Math.PI*2;

const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const $=id=>document.getElementById(id);
let touchUI=matchMedia('(pointer: coarse)').matches;
if(touchUI)document.body.classList.add('touch');

const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1,touchUI?1.75:2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight,false);
renderer.setClearColor(0x0a0720);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.3,16000);
const uTime={value:0};

// seeded RNG + 3D Perlin noise (used for every procedural world)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  const rnd=mulberry32(seed),p=new Uint8Array(512),perm=[];
  for(let i=0;i<256;i++)perm[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const grad=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14)?x:z;return((h&1)?-u:u)+((h&2)?-v:v);};
  return function(x,y,z){
    let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;
    const u=x*x*x*(x*(x*6-15)+10),v=y*y*y*(y*(y*6-15)+10),w=z*z*z*(z*(z*6-15)+10);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    const a0=grad(p[AA],x,y,z),a1=grad(p[BA],x-1,y,z),a2=grad(p[AB],x,y-1,z),a3=grad(p[BB],x-1,y-1,z);
    const b0=grad(p[AA+1],x,y,z-1),b1=grad(p[BA+1],x-1,y,z-1),b2=grad(p[AB+1],x,y-1,z-1),b3=grad(p[BB+1],x-1,y-1,z-1);
    const l0=a0+u*(a1-a0),l1=a2+u*(a3-a2),l2=b0+u*(b1-b0),l3=b2+u*(b3-b2);
    const m0=l0+v*(l1-l0),m1=l2+v*(l3-l2);

  };
}
function fbm(nz,x,y,z,oct){let a=1,f=1,s=0,t=0;for(let i=0;i<oct;i++){s+=a*nz(x*f,y*f,z*f);t+=a;a*=0.5;f*=2.02;}return s/t;}
function randUnit(rnd,out){const u=rnd()*2-1,a=rnd()*TAU,s=Math.sqrt(1-u*u);return (out||new V3()).set(s*Math.cos(a),u,s*Math.sin(a));}
function tangentBasis(d){const a=Math.abs(d.y)<0.9?new V3(0,1,0):new V3(1,0,0);const e1=new V3().crossVectors(d,a).normalize();const e2=new V3().crossVectors(d,e1).normalize();return [e1,e2];}
// rotation matrix for a model whose forward is -Z and up is +Y
const _bx=new V3(),_by=new V3(),_bz=new V3();
function setBasis(m,pos,fwd,up){_bz.copy(fwd).negate().normalize();_bx.crossVectors(up,_bz).normalize();_by.crossVectors(_bz,_bx);m.makeBasis(_bx,_by,_bz);m.setPosition(pos);return m;}
function Mx(px=0,py=0,pz=0,rx=0,ry=0,rz=0,sx=1,sy=sx,sz=sx){return new M4().compose(new V3(px,py,pz),new Q().setFromEuler(new THREE.Euler(rx,ry,rz)),new V3(sx,sy,sz));}
// matrix standing an object on a sphere: up = d, yawed around up
const _pp=new V3(),_pf=new V3();
function placeM(d,r,yaw=0,sx=1,sy=sx,sz=sx,fwd=null){
  const m=new M4();
  if(fwd){_pf.copy(fwd).addScaledVector(d,-fwd.dot(d)).normalize();}
  else{const [e1,e2]=tangentBasis(d);_pf.copy(e1).multiplyScalar(Math.cos(yaw)).addScaledVector(e2,Math.sin(yaw));}
  setBasis(m,_pp.copy(d).multiplyScalar(r),_pf,d);
  return m.scale(new V3(sx,sy,sz));
}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,repeat){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;if(repeat)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
const srgb=hex=>new C3(hex).convertLinearToSRGB();   // colour for shaders that write display values directly

/* ---------- 2. COMIC RENDER PIPELINE ---------- */
// 4-step quantised gradient => clean cel bands (deep shade / shade / light / full light)
const gradTex=(()=>{const d=new Uint8Array([58,58,58,255, 118,118,118,255, 206,206,206,255, 255,255,255,255]);
  const t=new THREE.DataTexture(d,4,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const toonCache=new Map();
function toon(hex,extra){
  if(extra)return new THREE.MeshToonMaterial({color:hex,gradientMap:gradTex,...extra});
  let m=toonCache.get(hex);if(!m){m=new THREE.MeshToonMaterial({color:hex,gradientMap:gradTex});toonCache.set(hex,m);}return m;
}
const vcToon=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gradTex});      // merged props (vertex colours)
const vcToonI=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gradTex});     // same, for instanced meshes

// Inverted-hull ink outline: back faces pushed out along the normal in view space.
const OUT_VS=`
uniform float uBase,uGrow,uMax;
void main(){
  vec4 p=vec4(position,1.0); vec3 n=normal;
  #ifdef USE_INSTANCING
    p=instanceMatrix*p; n=mat3(instanceMatrix)*n;
  #endif
  vec4 mv=modelViewMatrix*p;
  vec3 vn=normalize(normalMatrix*n);
  float t=clamp(-mv.z*uGrow,uBase,uMax);
  mv.xyz+=vn*t;
  gl_Position=projectionMatrix*mv;
}`;
const OUT_FS=`uniform vec3 uColor; void main(){ gl_FragColor=vec4(uColor,1.0); }`;
function outlineMat(base,grow,max,color=0x140c1f){
  return new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:OUT_VS,fragmentShader:OUT_FS,
    uniforms:{uBase:{value:base},uGrow:{value:grow},uMax:{value:max},uColor:{value:srgb(color)}}});
}
const OL_PROP=outlineMat(0.028,0.0011,0.09), OL_BIG=outlineMat(0.05,0.0013,0.16), OL_PLANET=outlineMat(0.035,0.0024,9), OL_SUN=outlineMat(1.2,0.004,14,0xc2410c);
// Outline hulls need smooth normals or hard edges split apart: average normals per position.
function smoothNormals(geo){
  const pos=geo.attributes.position,nor=geo.attributes.normal,n=pos.count,map=new Map(),ids=new Int32Array(n),lists=[];
  for(let i=0;i<n;i++){
    const k=Math.round(pos.getX(i)*400)+'_'+Math.round(pos.getY(i)*400)+'_'+Math.round(pos.getZ(i)*400);
    let id=map.get(k);if(id===undefined){id=lists.length;lists.push([]);map.set(k,id);}
    ids[i]=id;const L=lists[id],x=nor.getX(i),y=nor.getY(i),z=nor.getZ(i);let dup=false;
    for(let j=0;j<L.length;j+=3){if(L[j]*x+L[j+1]*y+L[j+2]*z>0.98){dup=true;break;}}
    if(!dup)L.push(x,y,z);
  }
  const out=new Float32Array(n*3);
  const sums=lists.map(L=>{let x=0,y=0,z=0;for(let j=0;j<L.length;j+=3){x+=L[j];y+=L[j+1];z+=L[j+2];}const l=Math.hypot(x,y,z)||1;return [x/l,y/l,z/l];});
  for(let i=0;i<n;i++){const s=sums[ids[i]];out[i*3]=s[0];out[i*3+1]=s[1];out[i*3+2]=s[2];}
  const g=new THREE.BufferGeometry();g.setAttribute('position',pos);g.setAttribute('normal',new THREE.BufferAttribute(out,3));if(geo.index)g.setIndex(geo.index);
  return g;
}
const olCache=new WeakMap();
function addOutline(mesh,mat=OL_PROP,smooth=true){
  let g=mesh.geometry;
  if(smooth){g=olCache.get(mesh.geometry);if(!g){g=smoothNormals(mesh.geometry);olCache.set(mesh.geometry,g);}}
  let o;
  if(mesh.isInstancedMesh){o=new THREE.InstancedMesh(g,mat,mesh.count);o.instanceMatrix=mesh.instanceMatrix;o.frustumCulled=mesh.frustumCulled;if(mesh.boundingSphere)o.boundingSphere=mesh.boundingSphere;}
  else o=new THREE.Mesh(g,mat);
  mesh.add(o);return o;
}
// merge coloured parts into one vertex-coloured geometry: parts = [geometry, hexColour, matrix?]
function merge(parts){
  let n=0;const gs=parts.map(([g,c,m])=>{const k=g.index?g.toNonIndexed():g.clone();if(m)k.applyMatrix4(m);n+=k.attributes.position.count;return [k,new C3(c)];});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
  for(const [k,c] of gs){const cnt=k.attributes.position.count;pos.set(k.attributes.position.array,o*3);nor.set(k.attributes.normal.array,o*3);
    for(let i=0;i<cnt;i++){col[(o+i)*3]=c.r;col[(o+i)*3+1]=c.g;col[(o+i)*3+2]=c.b;}o+=cnt;k.dispose();}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}
function instanced(geo,mat,mats,cols){
  const im=new THREE.InstancedMesh(geo,mat,Math.max(mats.length,1));
  mats.forEach((m,i)=>im.setMatrixAt(i,m));im.count=mats.length;
  if(cols){cols.forEach((c,i)=>im.setColorAt(i,c));if(im.instanceColor)im.instanceColor.needsUpdate=true;}
  im.instanceMatrix.needsUpdate=true;im.computeBoundingSphere();return im;
}
const GLSL_NOISE=`
float hash3(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

function buildLiving(b,cfg){
  const R=b.R,rnd=mulberry32(cfg.seed),n1=makeNoise(cfg.seed+1),n2=makeNoise(cfg.seed+2),n3=makeNoise(cfg.seed+3);
  b.liquid=true;b.liquidSolid=false;b.alive=true;
  // multi-octave base terrain: ocean basins, shelves, beaches, rolling hills, ridged mountains
  const hBase=(x,y,z)=>{
    const c=fbm(n1,x*1.25+7.1,y*1.25+1.3,z*1.25-3.3,5)*cfg.cAmp+cfg.bias;
    if(c<0)return Math.max(-9,-Math.pow(-c,1.4)*26);
    const shore=sstep(0,0.07,c),inland=sstep(0.05,0.45,c);
    const hills=fbm(n2,x*5,y*5,z*5,3)*0.5+0.5;
    const mm=sstep(0,0.28,fbm(n3,x*2.1+11,y*2.1,z*2.1,3)+inland*0.25-0.08);
    const rid=1-Math.abs(fbm(n3,x*4.2,y*4.2+5,z*4.2,3))*2.6,ridge=rid>0?rid*rid:0;
    return 0.3*shore+inland*(0.5+hills*cfg.hill)+mm*ridge*cfg.mount*sstep(0.08,0.3,c);
  };
  // --- three great-circle ring roads, chosen to cross as much land as possible
  const mkRoad=n=>{const [e1,e2]=tangentBasis(n);return {n,e1,e2};};
  const dirOn=(r,a,out)=>out.copy(r.e1).multiplyScalar(Math.cos(a)).addScaledVector(r.e2,Math.sin(a));
  const _d=new V3(),_t=new V3(),_p=new V3();
  const cands=[];
  for(let i=0;i<80;i++){const r=mkRoad(randUnit(rnd));let s=0;for(let k=0;k<120;k++){dirOn(r,k/120*TAU,_d);const h=hBase(_d.x,_d.y,_d.z);if(h>0.05&&h<3.5)s++;}cands.push({r,s});}
  cands.sort((a,b)=>b.s-a.s);
  const roads=[];
  for(const c of cands){if(roads.every(r=>Math.abs(r.n.dot(c.r.n))<0.55)){roads.push(c.r);if(roads.length===3)break;}}
  // --- five cities on the roads (junctions first)
  const cc=[];
  for(let i=0;i<roads.length;i++)for(let j=i+1;j<roads.length;j++){const x=new V3().crossVectors(roads[i].n,roads[j].n).normalize();cc.push(x,x.clone().negate());}
  for(const r of roads)for(let k=0;k<110;k++)cc.push(dirOn(r,rnd()*TAU,new V3()));
  const cities=[];let sep=0.62;
  while(cities.length<5&&sep>0.12){
    for(const d of cc){if(cities.length>=5)break;const h=hBase(d.x,d.y,d.z);if(h<0.35||h>2.6||Math.abs(d.y)>0.82)continue;
      const [e1,e2]=tangentBasis(d);let ok=true;
      for(let q=0;q<8&&ok;q++){_d.copy(d).addScaledVector(e1,Math.cos(q*TAU/8)*4.6/R).addScaledVector(e2,Math.sin(q*TAU/8)*4.6/R).normalize();if(hBase(_d.x,_d.y,_d.z)<0.12)ok=false;}
      if(!ok||cities.some(c=>c.dir.dot(d)>Math.cos(sep)))continue;
      cities.push({dir:d.clone(),h:clamp(h,0.45,1.5),e1,e2});}
    sep*=0.75;
  }
  // --- final height: roads cut gentle passes, cities sit on flat plazas
  const band=2.7/R,bandIn=1.25/R,cOut=7.5/R,cIn=4.9/R,cosOut=Math.cos(cOut),cosCity=Math.cos(5.6/R);
  const hFinal=(x,y,z)=>{
    let h=hBase(x,y,z);
    for(let i=0;i<roads.length;i++){const n=roads[i].n,d=x*n.x+y*n.y+z*n.z,ad=d<0?-d:d;
      if(ad<band){const px=x-n.x*d,py=y-n.y*d,pz=z-n.z*d,l=Math.hypot(px,py,pz);let hc=hBase(px/l,py/l,pz/l);if(hc>0)hc=clamp(hc,0.32,cfg.roadMax);h+=(hc-h)*sstep(band,bandIn,ad);}}
    for(let i=0;i<cities.length;i++){const c=cities[i],dd=x*c.dir.x+y*c.dir.y+z*c.dir.z;if(dd>cosOut)h+=(c.h-h)*sstep(cOut,cIn,Math.acos(Math.min(dd,1)));}
    return h;
  };
  b.heightAt=hFinal;
  const nearRoad=(d,w)=>roads.some(r=>Math.abs(d.dot(r.n))*R<w);
  const inCity=(d,cosv)=>cities.some(c=>c.dir.dot(d)>cosv);
  // --- terrain colours (flat comic palette per biome)
  const pal={};for(const k in cfg.pal)pal[k]=new C3(cfg.pal[k]);
  const colFn=(x,y,z,h,slope,c)=>{
    let col;const lat=Math.abs(y),fn=n2(x*3.1+20,y*3.1,z*3.1);
    if(h<0.3)col=pal.sand;
    else{let city=false;for(let i=0;i<cities.length;i++){const ct=cities[i].dir;if(x*ct.x+y*ct.y+z*ct.z>cosCity){city=true;break;}}
      if(city)col=pal.city;
      else if(h>cfg.snow-lat*lat*3.6+fn*0.6||lat>0.9)col=slope<0.7?pal.rock:pal.snow;
      else if(slope<0.78)col=pal.rock;
      else if(h>3.1)col=pal.alpine;
      else col=fn>0.12?pal.forest:fn<-0.2?pal.meadow:pal.grass;}
    c[0]=col.r;c[1]=col.g;c[2]=col.b;
  };
  const cloudU={value:[]};for(let i=0;i<cfg.clouds;i++)cloudU.value.push(new THREE.Vector4(0,1,0,2));
  buildRocky(b,{N:cfg.N,colFn,liq:cfg.water,clouds:cloudU});
  const D=b.detail=new THREE.Group();b.group.add(D);

  // --- road ribbons + red arch bridges
  const MS=600,roadMat=new THREE.MeshToonMaterial({map:roadTex,gradientMap:gradTex,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  const bridgeM=[];const segSlots=Math.round(TAU*(R+cfg.deck)/2.4),segLen=TAU*(R+cfg.deck)/segSlots;
  for(const r of roads){
    const prof=new Float32Array(MS),raw=new Float32Array(MS);
    for(let i=0;i<MS;i++){dirOn(r,i/MS*TAU,_d);const h=hFinal(_d.x,_d.y,_d.z);raw[i]=h;prof[i]=h<0.02?cfg.deck:h+0.08;}
    for(let pass=0;pass<4;pass++){const tmp=prof.slice();for(let i=0;i<MS;i++)prof[i]=Math.max(prof[i],(tmp[(i+MS-1)%MS]+tmp[i]+tmp[(i+1)%MS])/3);}
    r.height=a=>{let f=((a/TAU)%1+1)%1*MS;const i=Math.floor(f)%MS;f-=Math.floor(f);return prof[i]+(prof[(i+1)%MS]-prof[i])*f;};
    const pos=new Float32Array((MS+1)*6),nor=new Float32Array((MS+1)*6),uv=new Float32Array((MS+1)*4),idx=[];
    for(let i=0;i<=MS;i++){dirOn(r,i/MS*TAU,_d);const rr=R+prof[i%MS];
      for(let s=0;s<2;s++){const sg=s?1:-1,o=(i*2+s)*3;pos[o]=_d.x*rr+r.n.x*0.58*sg;pos[o+1]=_d.y*rr+r.n.y*0.58*sg;pos[o+2]=_d.z*rr+r.n.z*0.58*sg;nor[o]=_d.x;nor[o+1]=_d.y;nor[o+2]=_d.z;uv[(i*2+s)*2]=s;uv[(i*2+s)*2+1]=i*(TAU*R/MS)/1.7;}
      if(i<MS){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);
    D.add(new THREE.Mesh(g,roadMat));
    for(let k=0;k<segSlots;k++){const a=(k+0.5)/segSlots*TAU,i0=Math.round(a/TAU*MS)%MS;let over=false;
      for(let q=-2;q<=2;q++)if(raw[(i0+q+MS)%MS]<0.02)over=true;
      if(!over)continue;
      dirOn(r,a,_d);_t.copy(r.e1).multiplyScalar(-Math.sin(a)).addScaledVector(r.e2,Math.cos(a));
      bridgeM.push(setBasis(new M4(),_p.copy(_d).multiplyScalar(R+r.height(a)),_t,_d));}
  }
  if(bridgeM.length){const im=instanced(G.bridge(segLen),vcToonI,bridgeM);addOutline(im);D.add(im);}

  // --- cities: colourful towers and houses with lit windows
  const themes=[[0xff6b6b,0xffa94d,0xffd43b],[0x4dabf7,0x3bc9db,0x91a7ff],[0xb197fc,0xf783ac,0xe599f7],[0x69db7c,0xa9e34b,0x38d9a9],[0xffd43b,0xff922b,0xf06595]];
  const bM=[],bC=[],pM=[],pC=[],sM=[],lM=[],lC=[];
  cities.forEach((c,ci)=>{const th=themes[ci%5];
    for(let gx=-4;gx<=4;gx++)for(let gz=-4;gz<=4;gz++){
      const ox=gx*1.22+(rnd()-0.5)*0.2,oz=gz*1.22+(rnd()-0.5)*0.2,dist=Math.hypot(ox,oz);if(dist>5)continue;
      _d.copy(c.dir).addScaledVector(c.e1,ox/R).addScaledVector(c.e2,oz/R).normalize();
      if(nearRoad(_d,1.12))continue;
      const land=gx===2&&gz===-2;
      if(!land&&rnd()>0.92-dist*0.07)continue;
      const d=_d.clone(),gr=R+hFinal(d.x,d.y,d.z)-0.04;
      if(land){lM.push(placeM(d,gr,0,1,1,1,c.e1));lC.push(new C3(th[0]));b.colliders.push({p:d.clone().multiplyScalar(gr),r:0.55});continue;}
      const w=0.72+rnd()*0.3,dp=0.72+rnd()*0.3,hh=0.75+Math.pow(1-dist/5,1.4)*3.6*(0.35+rnd()*0.65)+rnd()*0.5;
      bM.push(placeM(d,gr,0,w,hh,dp,c.e1));bC.push(new C3(th[(rnd()*3)|0]).lerp(new C3(0xffffff),rnd()*0.25));
      if(hh<1.75){pM.push(placeM(d,gr+hh,0,w,0.8+rnd()*0.5,dp,c.e1));pC.push(new C3([0xd9463e,0x3b6fd9,0x8a4fd0,0xe8833a][(rnd()*4)|0]));}
      else sM.push(placeM(d,gr+hh,0,w,1,dp,c.e1));
      b.colliders.push({p:d.clone().multiplyScalar(gr),r:Math.max(w,dp)*0.62});
    }});
  if(bM.length){
    const im=instanced(G.box,new THREE.MeshToonMaterial({map:winTex.map,emissiveMap:winTex.emi,emissive:0xffffff,emissiveIntensity:1.1,gradientMap:gradTex}),bM,bC);addOutline(im);D.add(im);

  scatter(b,rnd,cfg.trees.dec,cfg.trees.dec*40,(d,h,r)=>(h>0.6&&h<2.8&&Math.abs(d.y)<0.75&&n2(d.x*3.1+20,d.y*3.1,d.z*3.1)>-0.02-r()*0.2&&free(d)&&!steep(d,h))?0.75+r()*0.7:0,G.dec,vcToonI,tint);

function craterHeight(seed,R,nCr,amp){
  const rnd=mulberry32(seed),nz=makeNoise(seed),cr=[];
  for(let i=0;i<nCr;i++){const d=randUnit(rnd),rad=0.1+rnd()*0.26;cr.push({x:d.x,y:d.y,z:d.z,rad,cos:Math.cos(rad*1.5),dep:(0.4+rnd()*0.6)*rad*R*0.32});}
  return (x,y,z)=>{let h=fbm(nz,x*2.6,y*2.6,z*2.6,3)*amp;
    for(let i=0;i<cr.length;i++){const c=cr[i],d=x*c.x+y*c.y+z*c.z;if(d>c.cos){const a=Math.acos(Math.min(1,d))/c.rad;h+=(a<1?-c.dep*(1-a*a):0)+c.dep*0.4*Math.exp(-((a-1)*(a-1))/0.03);}}
    return h;};
}
function makeMoon(o,cols,seed){
  const b=makeBody({moon:true,...o});const hf=b.heightAt=craterHeight(seed,b.R,12,b.R*0.05);
  const c0=new C3(cols[0]),c1=new C3(cols[1]),c2=new C3(cols[2]),k=b.R*0.03;
  buildRocky(b,{N:32,colFn:(x,y,z,h,s,c)=>{const col=h<-k?c0:h>k*1.1?c2:c1;c[0]=col.r;c[1]=col.g;c[2]=col.b;}});
  return b;
}
const GAS_VS=`varying vec3 vP,vWN,vWP; void main(){ vP=position; vWN=mat3(modelMatrix)*normal; vec4 wp=modelMatrix*vec4(position,1.0); vWP=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`;
function makeGas(o,cols,spot,bands,seed){
  const b=makeBody({kind:'gas',landable:false,...o});
  const mat=new THREE.ShaderMaterial({vertexShader:GAS_VS,uniforms:{uTime,uC0:{value:srgb(cols[0])},uC1:{value:srgb(cols[1])},uC2:{value:srgb(cols[2])},uC3:{value:srgb(cols[3])},uSpot:{value:srgb(spot)},uBands:{value:bands},uSeed:{value:seed}},
    fragmentShader:`precision highp float; uniform vec3 uC0,uC1,uC2,uC3,uSpot; uniform float uTime,uBands,uSeed; varying vec3 vP,vWN,vWP;
    ${GLSL_NOISE}
    void main(){
      vec3 p=normalize(vP); float lat=p.y, cl=sqrt(max(1.0-lat*lat,0.0));
      float lon=atan(p.z,p.x)+uTime*0.03*(1.0+0.5*sin(lat*7.0));
      vec3 q=vec3(cos(lon)*cl,lat,sin(lon)*cl);
      float w=vnoise(q*vec3(3.0,9.0,3.0)+uSeed)*0.6+vnoise(q*vec3(8.0,22.0,8.0)-uSeed)*0.3;
      float v=sin((lat+(w-0.45)*0.1)*uBands);
      vec3 c=uC0; c=mix(c,uC1,smoothstep(-0.53,-0.47,v)); c=mix(c,uC2,smoothstep(-0.03,0.03,v)); c=mix(c,uC3,smoothstep(0.47,0.53,v));
      float sl=mod(lon-1.0+3.14159,6.28318)-3.14159;
      float sr=length(vec2(sl*cl*0.55,(lat+0.32)*1.25));
      c=mix(c,uSpot,1.0-smoothstep(0.125,0.14,sr)); c=mix(c,min(uSpot*1.3+0.08,1.0),1.0-smoothstep(0.06,0.072,sr));
      float t=toonStep(dot(normalize(vWN),normalize(-vWP)));
      gl_FragColor=vec4(c*(t*0.9+0.12),1.0);
    }`});
  const m=new THREE.Mesh(new THREE.SphereGeometry(b.R,64,40),mat);b.group.add(m);m.add(new THREE.Mesh(m.geometry,OL_PLANET));
  return b;
}

const SFX=(()=>{

  try{muted=localStorage.getItem('cosmic-hop-mute')==='1';}catch(_){}

    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC();}catch(_){ctx=null;return;}

    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);

    nbuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=nbuf.getChannelData(0);let l=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+0.03*w)/1.03;d[i]=l*1.5+w*0.3;}
    const loop=()=>{const s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;s.start();return s;};

    engF=ctx.createBiquadFilter();engF.type='lowpass';engF.frequency.value=220;engF.Q.value=1.4;
    eng=ctx.createGain();eng.gain.value=0;engF.connect(eng);eng.connect(master);
    loop().connect(engF);
    const og=ctx.createGain();og.gain.value=0.22;og.connect(engF);
    o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=48;o1.connect(og);o1.start();
    o2=ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=48.6;o2.connect(og);o2.start();

  }
  function burst(freq,q,dur,vol,when=0,type='bandpass'){
    if(!ctx)return;const t=ctx.currentTime+when,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();

  }
  const play={
    click(){tone('square',520,780,0.08,0.05);},
    deny(){tone('square',150,120,0.14,0.08);tone('square',150,110,0.16,0.08,0.17);},
    landStart(){tone('sine',880,330,0.55,0.08);tone('sine',660,247,0.55,0.05,0.12);},
    thud(){tone('sine',130,42,0.38,0.5);burst(260,0.7,0.28,0.7,0,'lowpass');},
    discover(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone('triangle',f,f,0.34,0.13,0.3+i*0.09,musicG));},
    liftoff(){tone('sawtooth',60,300,1.7,0.09);burst(500,0.5,1.9,0.5);},
    jump(){tone('sine',280,640,0.2,0.13);},
    step(){burst(700+Math.random()*500,1.4,0.07,0.28);},
    door(){burst(1700,2,0.1,0.4);tone('triangle',392,523.25,0.16,0.09,0.07);},
    aboard(){tone('triangle',523.25,523.25,0.12,0.1);tone('triangle',783.99,783.99,0.22,0.1,0.11);},
    bump(){tone('sine',95,48,0.2,0.4);burst(200,0.8,0.14,0.4,0,'lowpass');},
    chirp(){const f=2300+Math.random()*1500;tone('sine',f,f*1.35,0.09,0.03);tone('sine',f*1.2,f*0.9,0.1,0.026,0.13);}
  };

    }
  }
  function toggle(){muted=!muted;label();try{localStorage.setItem('cosmic-hop-mute',muted?'1':'0');}catch(_){}

  addEventListener('pointerdown',resume,true);addEventListener('keydown',resume,true);
  return {init,play,update,toggle};
})();

    _c.copy(A.dir).multiplyScalar(gr0).addScaledVector(_a,sp*dt);

    for(const c of b.colliders){const dx=_c.x-c.p.x,dy=_c.y-c.p.y,dz=_c.z-c.p.z,d2=dx*dx+dy*dy+dz*dz,rr=c.r+0.22;if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2),k=rr/d;_c.set(c.p.x+dx*k,c.p.y+dy*k,c.p.z+dz*k);}}
    {const dx=_c.x-PL.local.x,dy=_c.y-PL.local.y,dz=_c.z-PL.local.z,d2=dx*dx+dy*dy+dz*dz;if(d2<1.9*1.9&&d2>1e-6){const k=1.9/Math.sqrt(d2);_c.set(PL.local.x+dx*k,PL.local.y+dy*k,PL.local.z+dz*k);}}
    _c.normalize();
    const h=b.heightAt(_c.x,_c.y,_c.z);
    if(!(b.liquid&&!b.liquidSolid&&h<-0.28)){
      _q.setFromUnitVectors(A.dir,_c);A.view.applyQuaternion(_q);A.face.applyQuaternion(_q);A.dir.copy(_c);}
  }
  A.view.addScaledVector(A.dir,-A.view.dot(A.dir)).normalize();A.face.addScaledVector(A.dir,-A.face.dot(A.dir)).normalize();
  // low-gravity hop
  if(PL.jumpQ&&A.yOff<=0.001){A.vy=5.2;SFX.play.jump();}PL.jumpQ=false;
  if(A.yOff>0||A.vy>0){A.yOff+=A.vy*dt;A.vy-=7.5*dt;if(A.yOff<=0){A.yOff=0;A.vy=0;}}
  placeAstro(b);
  // walk cycle
  const air=A.yOff>0.01,st0=Math.floor(A.phase/Math.PI);A.phase+=dt*(moving?(input.boost?15:10.5):0);
  if(moving&&!air&&Math.floor(A.phase/Math.PI)!==st0)SFX.play.step();
  const sw=moving&&!air?Math.sin(A.phase)*0.85:0,k=1-Math.exp(-dt*14);
  A.legL.rotation.x=lerp(A.legL.rotation.x,air?0.5:sw,k);A.legR.rotation.x=lerp(A.legR.rotation.x,air?-0.3:-sw,k);
  A.armL.rotation.x=lerp(A.armL.rotation.x,air?-2.4:-sw*0.8,k);A.armR.rotation.x=lerp(A.armR.rotation.x,air?-2.4:sw*0.8,k);
  A.S.position.y=moving&&!air?Math.abs(Math.sin(A.phase))*0.035:0;
  A.nearShip=A.group.position.distanceTo(PL.local)<3.6;
}
// ----- cameras
function clampCamToGround(b){
  if(!b||b.kind!=='rocky')return;_a.subVectors(camera.position,b.center);const r=_a.length();if(r>b.R*1.3+12)return;_a.multiplyScalar(1/r);
  const min=b.groundR(_a.x,_a.y,_a.z)+0.45;if(r<min)camera.position.copy(b.center).addScaledVector(_a,min);
}
function updateCamera(dt,snap){
  const g=ship.group;camera.position.add(carry);
  if(PL.mode==='fly'){
    _f.set(0,0,-1).applyQuaternion(g.quaternion);_u.set(0,1,0).applyQuaternion(g.quaternion);
    const sp=clamp(PL.speed/390,0,1);
    _a.copy(g.position).addScaledVector(_f,-(9.5+sp*5)).addScaledVector(_u,2.9);
    camera.position.lerp(_a,snap?1:1-Math.exp(-dt*5.5));camUp.lerp(_u,snap?1:1-Math.exp(-dt*4)).normalize();
    clampCamToGround(PL.near);
    _b.copy(g.position).addScaledVector(_f,6).addScaledVector(_u,1);
    camera.up.copy(camUp);camera.lookAt(_b);
    camera.fov=lerp(camera.fov,baseFov+sp*20,1-Math.exp(-dt*3));
  }else if(PL.mode==='walk'){
    const b=PL.body,A=astro;_u.copy(A.dir);
    _f.copy(A.view).multiplyScalar(Math.cos(A.pitch)).addScaledVector(_u,-Math.sin(A.pitch));
    _a.copy(A.group.position).addScaledVector(_u,0.95).addScaledVector(_f,-4.4).add(b.center);
    camera.position.lerp(_a,1-Math.exp(-dt*14));clampCamToGround(b);
    camUp.lerp(_u,1-Math.exp(-dt*8)).normalize();camera.up.copy(camUp);
    camera.lookAt(_b.copy(A.group.position).addScaledVector(_u,0.75).add(b.center));
    camera.fov=lerp(camera.fov,baseFov,1-Math.exp(-dt*3));
  }else{
    const b=PL.body;_u.subVectors(g.position,b.center).normalize();
    orbit.yaw-=look.x;orbit.pitch=clamp(orbit.pitch+look.y,0.06,1.35);
    _f.set(0,0,-1).applyQuaternion(g.quaternion);_f.addScaledVector(_u,-_f.dot(_u));if(_f.lengthSq()<1e-4)_f.copy(tangentBasis(_u)[0]);_f.normalize();
    _f.applyQuaternion(_q.setFromAxisAngle(_u,orbit.yaw+Math.PI));
    _a.copy(g.position).addScaledVector(_f,Math.cos(orbit.pitch)*12).addScaledVector(_u,Math.sin(orbit.pitch)*12);
    camera.position.lerp(_a,1-Math.exp(-dt*4.5));clampCamToGround(b);
    camUp.lerp(_u,1-Math.exp(-dt*4)).normalize();camera.up.copy(camUp);camera.lookAt(_b.copy(g.position).addScaledVector(_u,0.4));
    camera.fov=lerp(camera.fov,baseFov,1-Math.exp(-dt*3));
  }
}
// ----- HUD
const locEl=$('loc'),subEl=$('sub'),spdBar=$('spdBar'),promptEl=$('prompt'),linesEl=$('lines'),markersEl=$('markers');
let baseFov=62;
function updatePassport(){$('pcount').textContent=bodies.filter(b=>b.visited).length;$('ptotal').textContent=bodies.filter(b=>b.landable).length;}
function makeMarkers(){for(const b of bodies){const el=document.createElement('div');el.className='mk';el.innerHTML=`<b style="background:${b.color}"></b><span></span>`;markersEl.appendChild(el);b.mk=el;b.mkT=el.lastChild;}}
const _mv=new V3();
function updateMarkers(ref){
  const w=innerWidth,h=innerHeight;
  for(const b of bodies){
    const dist=ref.distanceTo(b.center)-b.R;
    let show=started&&dist>b.R*1.6&&!(b.moon&&dist>1100);
    if(show){
      _mv.copy(b.center).applyMatrix4(camera.matrixWorldInverse);const behind=_mv.z>0;
      _mv.applyMatrix4(camera.projectionMatrix);let x=_mv.x,y=_mv.y;
      if(behind){x=-x;y=-y;}
      let off=behind||Math.abs(x)>0.94||Math.abs(y)>0.9;
      if(off){const k=1/Math.max(Math.abs(x)/0.94,Math.abs(y)/0.88,1e-3);if(behind||k<1){x*=k;y*=k;}}
      if(off&&b.moon)show=false;
      else{b.mk.className=off?'mk off':'mk';
        b.mk.style.transform=`translate(${((x*0.5+0.5)*w).toFixed(1)}px,${((-y*0.5+0.5)*h).toFixed(1)}px) translate(-50%,${off?'-50%':'-135%'})`;
        b.mkT.textContent=b.name+' '+(dist>=1000?(dist/1000).toFixed(1)+'k':Math.round(dist));}
    }
    b.mk.style.display=show?'':'none';
  }
}
let hudT=0;
const key=k=>touchUI?'':`<kbd>${k}</kbd> `;
function setPrompt(html){if(html){if(promptEl.dataset.h!==html){promptEl.innerHTML=html;promptEl.dataset.h=html;}promptEl.classList.add('on');}else promptEl.classList.remove('on');}
function setBtn(el,label,hidden,dim,pulse){if(el.textContent!==label)el.textContent=label;el.hidden=hidden;el.classList.toggle('dim',!!dim);el.classList.toggle('pulse',!!pulse);}
function updateHUD(dt){
  hudT-=dt;if(hudT>0)return;hudT=0.1;
  const b=PL.near,m=PL.mode;
  if(m==='walk'){locEl.textContent=PL.body.name;subEl.textContent='ON FOOT · '+(PL.body.blurb||'');}
  else if(m==='landed'){locEl.textContent=PL.body.name;subEl.textContent='LANDED · '+(PL.body.blurb||'');}
  else if(b&&PL.alt<b.R*2.2+60){locEl.textContent=b.name;subEl.textContent='ALT '+Math.max(0,Math.round(PL.alt))+' · SPD '+Math.round(PL.speed);}
  else{locEl.textContent='DEEP SPACE';subEl.textContent='SPD '+Math.round(PL.speed)+(b?' · NEAREST '+b.name:'');}
  spdBar.style.width=(m==='fly'?clamp(Math.abs(PL.speed)/390,0,1)*100:0)+'%';
  linesEl.style.opacity=(m==='fly'&&input.boost&&PL.speed>60)?clamp((PL.speed-60)/200,0,0.8):0;
  const canLand=m==='fly'&&b&&b.landable&&PL.alt<landRange(b);
  if(m==='fly'){setBtn(bLand,'LAND',false,!canLand,canLand);setBtn(bExit,'EXIT',true);setBtn(bBoost,'BOOST',false);
    if(canLand)setPrompt(`${key('L')}LAND ON ${b.name}`);
    else if(b&&!b.landable&&b.kind==='gas'&&PL.alt<b.R*0.6)setPrompt(`${b.name} IS ALL CLOUD — LAND ON ONE OF ITS MOONS`);
    else setPrompt('');}
  else if(m==='landed'){setBtn(bLand,'TAKE OFF',false);setBtn(bExit,'EXIT',false,false,true);setBtn(bBoost,'BOOST',true);setPrompt(`${key('E')}HOP OUT · ${key('L')}TAKE OFF`);}
  else if(m==='walk'){setBtn(bLand,'JUMP',false);setBtn(bExit,'ENTER',false,!astro.nearShip,astro.nearShip);setBtn(bBoost,'RUN',false);setPrompt(astro.nearShip?`${key('E')}CLIMB ABOARD`:'');}
  else{setBtn(bLand,m==='landing'?'LANDING':'LIFTOFF',false,true);setBtn(bExit,'EXIT',true);setBtn(bBoost,'BOOST',true);setPrompt('');}
}
function actLand(){if(PL.mode==='fly')tryLand();else if(PL.mode==='landed')takeOff();else if(PL.mode==='walk')PL.jumpQ=true;}
function actExit(){if(PL.mode==='landed')exitShip();else if(PL.mode==='walk')enterShip();}
function actSpace(){if(PL.mode==='landed')takeOff();else if(PL.mode==='walk')PL.jumpQ=true;}

// ----- main loop
const prevShip=new V3();let simT=0;
function frame(dt){
  simT+=dt;uTime.value=simT;
  updateOrbits(simT);
  readInput();
  const g=ship.group;prevShip.copy(g.position);
  const anchor=PL.mode==='fly'?(PL.near&&PL.alt<PL.near.R*2.5+60?PL.near:null):PL.body;
  if(PL.mode==='fly'){if(anchor)g.position.add(anchor.delta);if(started)updateFly(dt);else ship.flameT=0.3;}
  else if(PL.mode==='landing')updateLanding(dt);
  else if(PL.mode==='takeoff')updateTakeoff(dt);
  else{g.position.copy(PL.body.center).add(PL.local);ship.flameT=0;if(PL.mode==='walk')updateWalk(dt);}
  if(PL.mode==='fly')carry.subVectors(g.position,prevShip);else carry.copy(PL.body.delta);
  // nearest world + altitude (after moving)
  const ref=PL.mode==='walk'?_e.copy(astro.group.position).add(PL.body.center):g.position;
  PL.near=findNear(g.position);PL.alt=PL.near?altitudeOver(PL.near,g.position):1e9;
  // engine flame
  ship.flameS=lerp(ship.flameS,ship.flameT||0,1-Math.exp(-dt*8));
  ship.flame.visible=ship.flameS>0.03;ship.flame.scale.set(0.8+ship.flameS*0.3,0.8+ship.flameS*0.3,ship.flameS*(0.85+Math.random()*0.3));
  updateCamera(dt,false);
  look.x=look.y=0;
  // per-world life, level of detail, atmosphere + sky
  let tint=0;
  for(const b of bodies){
    const cd=camera.position.distanceTo(b.center);
    const nearCam=cd<b.R*8+160;
    if(b.detail)b.detail.visible=nearCam;
    if(nearCam||b.alwaysUpdate)for(const u of b.updaters)u(dt,simT);
    if(b.atmoS){const inside=cd<b.atmoS;b.atmoOut.visible=!inside;b.atmoIn.visible=inside;
      if(inside&&b.sky){_a.subVectors(camera.position,b.center).normalize();const day=sstep(-0.3,0.3,_a.dot(_b.copy(b.center).negate().normalize()));
        const amt=clamp(1-(cd-b.R)/(b.atmoS-b.R),0,1);const k=Math.pow(amt,0.7)*day*b.sky*0.92;
        if(k>tint){tint=k;skyMat.uniforms.uTint.value.copy(srgb(b.skyColor));skyMat.uniforms.uUp.value.copy(_a);}}}
  }
  skyMat.uniforms.uTintAmt.value=tint;for(const m of starMats)m.opacity=1-tint;
  skyGroup.position.copy(camera.position);
  const camAlt=PL.near?Math.max(0,camera.position.distanceTo(PL.near.center)-PL.near.R):1e3;
  camera.near=clamp(camAlt*0.03,0.14,2.5);camera.updateProjectionMatrix();
  // sound follows the ship and where you are
  const md=PL.mode,flying=md==='fly'||md==='landing'||md==='takeoff',nb=PL.near,spF=clamp(Math.abs(PL.speed)/390,0,1);
  const inAir=nb&&nb.atmoS&&nb.sky&&g.position.distanceTo(nb.center)<nb.atmoS;
  SFX.update(dt,{on:started,engine:started&&flying,flame:ship.flameS,speedF:md==='fly'?spF:0,
    wind:!started?0:md==='fly'?spF*0.09+(inAir?clamp(PL.speed/50,0,1)*0.05:0):(PL.body&&PL.body.sky?0.022:0),
    mood:!flying?'walk':(nb&&PL.alt<nb.R*2?'near':'space'),birds:started&&md==='walk'&&!!PL.body.alive});
  updateHUD(dt);updateMarkers(ref);
  renderer.render(scene,camera);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;baseFov=camera.aspect<1?76:62;camera.updateProjectionMatrix();}
addEventListener('resize',resize);

// ----- boot: build the worlds step by step so the title card stays responsive
const playBtn=$('play');
async function boot(){
  resize();buildPropGeos();
  const steps=buildWorld();
  for(const [label,fn] of steps){playBtn.textContent=label+'…';await new Promise(r=>setTimeout(r,20));fn();}
  ship=buildShip();scene.add(ship.group);astro=buildAstro();
  updateOrbits(0);
  // start above Terra's sunlit side, nose pointed at it
  const terra=bodies.find(b=>b.name==='TERRA'),toSun=terra.center.clone().negate().normalize(),side=new V3().crossVectors(toSun,AY).normalize();
  const off=toSun.clone().multiplyScalar(0.72).addScaledVector(AY,0.42).addScaledVector(side,0.55).normalize().multiplyScalar(terra.R*2.75);
  ship.group.position.copy(terra.center).add(off);
  ship.group.quaternion.setFromRotationMatrix(setBasis(_m,_a.set(0,0,0),off.clone().negate().normalize().addScaledVector(side,0.22).normalize(),AY));
  PL.near=terra;PL.alt=altitudeOver(terra,ship.group.position);
  camera.fov=baseFov;carry.set(0,0,0);updateCamera(0.016,true);
  makeMarkers();updatePassport();
  let last=performance.now();
  renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,0.05);last=now;frame(dt);});
  playBtn.disabled=false;playBtn.textContent='PLAY!';playBtn.focus();
  playBtn.addEventListener('click',()=>{
    SFX.init();SFX.play.click();
    started=true;$('start').classList.add('bye');$('ui').classList.add('live');canvas.focus();PL.speed=30;
    toast('FLY TO TERRA!');
  });
}
boot().catch(err=>{console.error(err);const e=$('err');e.hidden=false;e.textContent='Could not start: '+(err&&err.message||err);playBtn.textContent='OOPS';});
// debug / testing hook
window.__game={SFX,PL,bodies,get ship(){return ship;},get astro(){return astro;},actLand,actExit,keys,look,camera,frame};
</script>
